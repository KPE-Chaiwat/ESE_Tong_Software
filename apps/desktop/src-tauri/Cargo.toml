[package]
name = "esefact-desktop"
description = "ESEfact desktop shell (thin Tauri layer)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "esefact_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The workspace exception for unsafe code (see `[workspace.lints]` in the root Cargo.toml):
# `deny` instead of the workspace `forbid`, so that exactly the Win32 modules
# `src/key_menu.rs::win` and `src/os_timer.rs::win` can allow it locally. Enforced by
# `tests/unsafe_policy.rs`. Mirror every lint of `[workspace.lints]` here.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[build-dependencies]
tauri-build.workspace = true

[features]
# DEV/QA ONLY (Q-002-14): registers `dev_fail_next_window_op` (see src/dev_hooks.rs). Never
# enabled by default, by `pnpm build` or in releases.
dev-hooks = []

[dependencies]
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-fs.workspace = true
tauri-plugin-store.workspace = true
tauri-plugin-window-state.workspace = true
serde.workspace = true
serde_json.workspace = true
shared-types.workspace = true
platform.workspace = true
modbus-master.workspace = true
transport.workspace = true

[target.'cfg(windows)'.dependencies]
# Window subclassing for the lone-Alt guard (`key_menu.rs`, REPORT-006 D2) and the timer
# precision of polling (`os_timer.rs`, REPORT-006 D1).
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Media", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { workspace = true }
