[workspace]
resolver = "2"
members = [
  "crates/modbus-core",
  "crates/transport",
  "crates/modbus-master",
  "crates/platform",
  "crates/shared-types",
  "apps/desktop/src-tauri",
  # Dev-only test tool (Modbus TCP slave simulator for QA). Not a product crate, not bundled;
  # no product crate may depend on it.
  "crates/dev-sim-slave",
  "crates/modbus-master-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
authors = ["tong_ese"]
publish = false

[workspace.dependencies]
# Internal crates (dependency direction: modbus-core <- transport <- modbus-master <- src-tauri)
modbus-core = { path = "crates/modbus-core" }
transport = { path = "crates/transport" }
modbus-master = { path = "crates/modbus-master" }
platform = { path = "crates/platform" }
shared-types = { path = "crates/shared-types" }

# External
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1.47", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
tokio-serial = "5.5"
async-trait = "0.1"
dirs = "7"
proptest = "1"
tempfile = "3"
# Win32 calls behind #[cfg(windows)] in src-tauri only (timer precision, the Alt key menu
# guard). Already in the lock file through tokio/tao.
windows-sys = "0.61"

# Every crate inherits these lints with `[lints] workspace = true`.
#
# The one exception (REPORT-006 D1/D2, REV-008 m-4, accepted by the PM): `esefact-desktop`
# (apps/desktop/src-tauri) declares its own lints with `unsafe_code = "deny"` instead of
# `forbid`, because `forbid` cannot be allowed locally and two Win32 modules need it:
# `src/key_menu.rs` (module `win`, window subclassing) and `src/os_timer.rs` (module `win`,
# timeBeginPeriod/timeEndPeriod). It also denies `clippy::undocumented_unsafe_blocks` and
# must mirror every lint added here. The test `apps/desktop/src-tauri/tests/unsafe_policy.rs`
# fails on unsafe code or `allow(unsafe_code)` anywhere else in the workspace and on a crate
# that stops inheriting these lints.
[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
