[package]
name = "transport"
description = "Byte transports for Modbus (TCP and serial). Depends on modbus-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# In-process fake Modbus slave for tests of this crate and of modbus-master.
test-support = []

[dependencies]
modbus-core.workspace = true
tokio.workspace = true
tokio-serial.workspace = true
async-trait.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
